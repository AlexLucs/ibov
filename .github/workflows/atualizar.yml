name: Atualizar Ibovespa

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19:30 de Brasília, seg–sex (pregão fecha às 17h)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

# Nunca roda duas atualizações ao mesmo tempo (agendada + manual).
concurrency:
  group: atualizar-ibov
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # necessário só para o commit dos arquivos de dados
    steps:
      # Actions fixadas por SHA (a tag pode ser movida; o SHA não). O Dependabot propõe atualizações.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0    # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python atualizar_ibov.py

      - name: Commit se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ibov_recente.js dados_historicos.js
          if git diff --cached --quiet; then
            echo "Sem dados novos."
            exit 0
          fi
          msg="dados: $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          if ! git diff --cached --quiet -- dados_historicos.js; then
            msg="$msg (histórico consolidado)"
          fi
          git commit -m "$msg"
          git pull --rebase --autostash
          git push
