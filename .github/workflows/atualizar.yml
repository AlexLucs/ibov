name: Atualizar Ibovespa

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19:30 de Brasília, seg–sex (pregão fecha às 17h)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python atualizar_ibov.py

      - name: Commit se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ibov_recente.js
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "dados: $(date -u +%Y-%m-%d)"
            git push
          fi
