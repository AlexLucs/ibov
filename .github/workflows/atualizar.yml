name: Atualizar Ibovespa

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19:30 de Brasília, seg–sex (pregão fecha às 17h)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

# Nunca roda duas atualizações ao mesmo tempo (agendada + manual).
concurrency:
  group: atualizar-ibov
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # necessário só para o commit do ibov_recente.js
    steps:
      # Actions fixadas por SHA (a tag pode ser movida; o SHA não). O Dependabot propõe atualizações.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1    # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python atualizar_ibov.py

      - name: Commit se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ibov_recente.js
          if git diff --cached --quiet; then
            echo "Sem dados novos."
            exit 0
          fi
          git commit -m "dados: $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
